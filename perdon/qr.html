<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tarjeta QR</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500&family=Geist+Mono:wght@400;500&family=La+Belle+Aurore&display=swap" rel="stylesheet">
  <style>
    :root {
      --carbon: #161311; --papel: #efe8dd; --papel-2: #e5dccd; --papel-3: #f7f2ea;
      --tinta: #1d1815; --vino: #a3354a; --suave: rgba(29, 24, 21, .58); --linea: rgba(29, 24, 21, .14);
      --serif: "Instrument Serif", serif; --sans: "Geist", system-ui, sans-serif; --mono: "Geist Mono", ui-monospace, monospace; --mano: "La Belle Aurore", cursive;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--papel); color: var(--tinta); font-family: var(--sans); font-weight: 300; -webkit-font-smoothing: antialiased; }
    .mono { font-family: var(--mono); font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; }
    .panel { max-width: 1100px; margin: 0 auto; padding: 48px 16px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center; }
    .panel h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(2.4rem, 5vw, 3.6rem); line-height: 1; letter-spacing: -.02em; margin: 12px 0 16px; }
    .panel h1 em { color: var(--vino); }
    .panel p { color: var(--suave); max-width: 46ch; line-height: 1.6; margin: 0 0 24px; }
    label { display: grid; gap: 8px; margin-bottom: 8px; }
    input { font: inherit; font-family: var(--mono); font-size: .85rem; padding: 14px 16px; border: 1px solid var(--linea); border-radius: 10px; background: var(--papel-3); color: var(--tinta); width: 100%; }
    input:focus { outline: 1px solid var(--vino); border-color: var(--vino); }
    .ayuda { font-size: .82rem; color: var(--suave); margin: 0 0 24px; min-height: 1.2em; }
    .ayuda.alerta { color: var(--vino); }
    .acciones { display: flex; flex-wrap: wrap; gap: 12px; }
    .btn { font-family: var(--mono); font-size: .72rem; letter-spacing: .16em; text-transform: uppercase; min-height: 50px; padding: 0 24px; border-radius: 999px; border: 0; cursor: pointer; transition: transform .4s cubic-bezier(.16,1,.3,1); }
    .btn:active { transform: scale(.98); }
    .btn--lleno { background: var(--vino); color: var(--papel); }
    .btn--borde { background: transparent; color: var(--tinta); box-shadow: inset 0 0 0 1px var(--linea); }
    .btn--borde:hover { box-shadow: inset 0 0 0 1px var(--tinta); }
    .escenario { display: grid; place-items: center; padding: 24px 0; }

    /* ----- La tarjeta (60 x 90 mm) ----- */
    .tarjeta {
      width: 60mm; height: 90mm; background: var(--papel-3); color: var(--tinta);
      padding: 6mm 6mm 5mm; display: grid; grid-template-rows: auto auto 1fr auto; position: relative; overflow: hidden;
      box-shadow: 0 30px 60px -30px rgba(60, 34, 24, .5), 0 1px 2px rgba(0, 0, 0, .12);
      rotate: -2deg; transform-origin: center;
    }
    .tarjeta::after { content: ""; position: absolute; inset: 2.2mm; border: .25mm solid var(--linea); pointer-events: none; }
    .t-cabeza { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 1.9mm; letter-spacing: .14em; text-transform: uppercase; color: var(--suave); }
    .t-para { font-family: var(--serif); font-size: 6.4mm; line-height: 1; margin: 3.2mm 0 3mm; letter-spacing: -.01em; }
    .t-para em { color: var(--vino); }
    .t-qr { display: grid; place-items: center; }
    .t-qr svg { width: 40mm; height: 40mm; display: block; }
    .t-pie { display: grid; gap: 1.2mm; text-align: center; }
    .t-escanea { font-family: var(--mono); font-size: 2.1mm; letter-spacing: .3em; text-transform: uppercase; color: var(--vino); }
    .t-dedicatoria { font-family: var(--mano); font-size: 4.2mm; line-height: 1.2; }

    .hoja { display: none; }

    @media (max-width: 800px) { .panel { grid-template-columns: 1fr; gap: 24px; } }

    @media print {
      @page { size: A4; margin: 10mm; }
      body { background: #fff; }
      .panel { display: none; }
      .hoja { display: grid; grid-template-columns: repeat(3, 60mm); gap: 4mm; justify-content: center; }
      .hoja .tarjeta { rotate: 0deg; box-shadow: none; outline: .2mm dashed #bbb; break-inside: avoid; }
    }
  </style>
</head>
<body>
  <section class="panel">
    <div>
      <p class="mono">Para el dulce</p>
      <h1>La misma idea de aquella vez, <em>pero ahora te lleva aquí.</em></h1>
      <p>Esta tarjeta abre tu página de perdón. Descárgala como imagen para pegarla en el dulce, o imprime una hoja con varias y recorta la que quede mejor.</p>
      <label>
        <span class="mono">Enlace de la página</span>
        <input id="url" type="url" spellcheck="false" autocomplete="off">
      </label>
      <p class="ayuda" id="ayuda"></p>
      <div class="acciones">
        <button class="btn btn--lleno" id="descargar" type="button">Descargar imagen</button>
        <button class="btn btn--borde" id="imprimir" type="button">Imprimir hoja</button>
      </div>
    </div>
    <div class="escenario" id="escenario"></div>
  </section>
  <div class="hoja" id="hoja" aria-hidden="true"></div>

  <script src="config.js"></script>
  <script src="vendor/qrcode.js"></script>
  <script>
  (function () {
    'use strict';
    var C = window.PERDON || {};
    var input = document.getElementById('url');
    var ayuda = document.getElementById('ayuda');
    var escenario = document.getElementById('escenario');
    var hoja = document.getElementById('hoja');

    var porDefecto = C.urlPagina || new URL('./', location.href).href;
    input.value = porDefecto;

    function matriz(texto) {
      var qr = qrcode(0, 'M');
      qr.addData(texto);
      qr.make();
      return qr;
    }
    function svgQR(qr) {
      var n = qr.getModuleCount(), d = '';
      for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (qr.isDark(r, c)) d += 'M' + c + ' ' + r + 'h1v1h-1z';
      return '<svg viewBox="0 0 ' + n + ' ' + n + '" shape-rendering="crispEdges" role="img" aria-label="Código QR"><path fill="#1d1815" d="' + d + '"/></svg>';
    }
    function escapar(t) { return String(t || '').replace(/[&<>"]/g, function (m) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]; }); }
    function tarjetaHTML(qr) {
      var c = C.cancion || {};
      return '<article class="tarjeta">' +
        '<div class="t-cabeza"><span>N.º 001</span><span>' + escapar(c.titulo || '') + '</span></div>' +
        '<p class="t-para">Para <em>' + escapar(C.ella || 'ti') + '</em></p>' +
        '<div class="t-qr">' + svgQR(qr) + '</div>' +
        '<div class="t-pie"><span class="t-escanea">' + escapar(C.textoTarjeta || 'Escanéame') + '</span>' +
        '<span class="t-dedicatoria">' + escapar(C.dedicatoriaTarjeta || '') + '</span></div>' +
        '</article>';
    }
    var qrActual;
    function pintar() {
      var url = input.value.trim();
      if (!url) { ayuda.textContent = 'Escribe el enlace de tu página.'; ayuda.className = 'ayuda alerta'; return; }
      try { qrActual = matriz(url); } catch (e) { ayuda.textContent = 'Ese enlace es demasiado largo para un QR.'; ayuda.className = 'ayuda alerta'; return; }
      escenario.innerHTML = tarjetaHTML(qrActual);
      var h = '';
      for (var i = 0; i < 9; i++) h += tarjetaHTML(qrActual);
      hoja.innerHTML = h;
      var local = /^(file:|http:\/\/(localhost|127\.0\.0\.1))/i.test(url);
      ayuda.className = local ? 'ayuda alerta' : 'ayuda';
      ayuda.textContent = local
        ? 'Este enlace solo funciona en tu computador. Publica la página primero y pega aquí el enlace público.'
        : 'Escanéalo con tu celular para probarlo antes de imprimir.';
    }
    input.addEventListener('input', pintar);
    pintar();

    document.getElementById('imprimir').addEventListener('click', function () { window.print(); });

    // Descarga en PNG de alta resolución (dibujada a mano en canvas)
    document.getElementById('descargar').addEventListener('click', function () {
      (document.fonts ? document.fonts.ready : Promise.resolve()).then(function () {
        var mm = 14;                               // px por milímetro (~355 ppp)
        var W = 60 * mm, H = 90 * mm;
        var cv = document.createElement('canvas'); cv.width = W; cv.height = H;
        var x = cv.getContext('2d');
        var c = C.cancion || {};
        x.fillStyle = '#f7f2ea'; x.fillRect(0, 0, W, H);
        x.strokeStyle = 'rgba(29,24,21,.14)'; x.lineWidth = .25 * mm; x.strokeRect(2.2 * mm, 2.2 * mm, W - 4.4 * mm, H - 4.4 * mm);
        x.fillStyle = 'rgba(29,24,21,.58)'; x.font = (1.9 * mm) + 'px "Geist Mono"'; x.textBaseline = 'top';
        if ('letterSpacing' in x) x.letterSpacing = (0.27 * mm) + 'px';
        x.textAlign = 'left'; x.fillText('N.º 001', 6 * mm, 6 * mm);
        x.textAlign = 'right'; x.fillText(String(c.titulo || '').toUpperCase(), W - 6 * mm, 6 * mm);
        if ('letterSpacing' in x) x.letterSpacing = '0px';
        x.textAlign = 'left'; x.font = (6.4 * mm) + 'px "Instrument Serif"'; x.fillStyle = '#1d1815';
        var para = 'Para '; x.fillText(para, 6 * mm, 10.6 * mm);
        x.fillStyle = '#a3354a'; x.font = 'italic ' + (6.4 * mm) + 'px "Instrument Serif"';
        x.font = (6.4 * mm) + 'px "Instrument Serif"'; var w0 = x.measureText(para).width;
        x.font = 'italic ' + (6.4 * mm) + 'px "Instrument Serif"'; x.fillText(C.ella || 'ti', 6 * mm + w0, 10.6 * mm);
        var n = qrActual.getModuleCount(), lado = 40 * mm, cel = lado / n, ox = (W - lado) / 2, oy = 22 * mm;
        x.fillStyle = '#1d1815';
        for (var r = 0; r < n; r++) for (var k = 0; k < n; k++) if (qrActual.isDark(r, k)) x.fillRect(Math.floor(ox + k * cel), Math.floor(oy + r * cel), Math.ceil(cel), Math.ceil(cel));
        x.textAlign = 'center'; x.fillStyle = '#a3354a'; x.font = (2.1 * mm) + 'px "Geist Mono"';
        if ('letterSpacing' in x) x.letterSpacing = (0.63 * mm) + 'px';
        x.fillText(String(C.textoTarjeta || 'Escanéame').toUpperCase(), W / 2, 70 * mm);
        if ('letterSpacing' in x) x.letterSpacing = '0px';
        x.fillStyle = '#1d1815'; x.font = (4.2 * mm) + 'px "La Belle Aurore"';
        x.fillText(C.dedicatoriaTarjeta || '', W / 2, 75 * mm);
        var a = document.createElement('a');
        a.download = 'tarjeta-qr.png'; a.href = cv.toDataURL('image/png'); a.click();
      });
    });
  })();
  </script>
</body>
</html>
